# Active colour: "upstream app { server app-blue:8080; }" or app-green, written by scripts/deploy-production.sh
include /etc/nginx/upstream/active.conf;

server {
    listen 80;

    location / {
        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
