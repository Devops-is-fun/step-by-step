name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push on the same branch cancels the run still in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # GHCR only accepts lowercase names: the organisation "Devops-is-fun" is written in lowercase here
  IMAGE: ghcr.io/devops-is-fun/step-by-step

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the new image tag in k8s/ (GitOps), from main only
      packages: write # push the image to GHCR with the automatic GITHUB_TOKEN

    # Throwaway PostgreSQL for the integration tests, on port 5433 like application-test.yml expects
    services:
      postgres:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_DB: stepbystep_test
          POSTGRES_USER: stepbystep
          POSTGRES_PASSWORD: test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U stepbystep -d stepbystep_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        run: docker run --rm -v "$(pwd):/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Lint
        run: ./mvnw -B -ntp checkstyle:check

      # Dockerfile best practices (pinned base image, non-root numeric user, no cache left…)
      - name: Dockerfile lint
        run: docker run --rm -i hadolint/hadolint:v2.15.1 < environments/runtime/Dockerfile

      # Unit tests + integration tests + coverage minimum: the jar is built once, here
      - name: Tests and package
        run: ./mvnw -B -ntp verify

      # The image is built and scanned on every run (PRs included); it is pushed from main only.
      # It packages the jar tested above. Tag = commit SHA (what Kubernetes deploys) + latest
      # (convenience only, never in manifests)
      - name: Build image
        run: |
          cp target/step-by-step-*.jar environments/runtime/app.jar
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" environments/runtime

      # Known vulnerabilities (CVE) in the OS packages and the jar dependencies: blocks on
      # HIGH/CRITICAL ones that already have a fix (nothing to do about the others but wait)
      - name: Vulnerability scan
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          ghcr.io/aquasecurity/trivy:0.76.1 image
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress
          "$IMAGE:$GITHUB_SHA"

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: docker push --all-tags "$IMAGE"

      # Continuous deployment (GitOps): the CI only writes the new tag in git, Flux (in the cluster)
      # applies it. A commit pushed with GITHUB_TOKEN does not start a new workflow run: no loop.
      - name: Deploy (update the image tag for Flux)
        if: github.ref == 'refs/heads/main'
        run: |
          sed -i "s#image: $IMAGE:.*#image: $IMAGE:$GITHUB_SHA#" k8s/20-app.yaml
          git diff --exit-code --quiet k8s/20-app.yaml && { echo "Tag already up to date"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/20-app.yaml
          git commit -m "chore(deploy): step-by-step ${GITHUB_SHA::7}"
          # main may have moved during the run: replay our commit on top before pushing
          git pull --rebase origin main
          git push origin HEAD:main
