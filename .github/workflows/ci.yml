name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push on the same branch cancels the run still in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # GHCR only accepts lowercase names: the organisation "Devops-is-fun" is written in lowercase here
  IMAGE: ghcr.io/devops-is-fun/step-by-step

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to GHCR with the automatic GITHUB_TOKEN

    # Throwaway PostgreSQL for the integration tests, on port 5433 like application-test.yml expects
    services:
      postgres:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_DB: stepbystep_test
          POSTGRES_USER: stepbystep
          POSTGRES_PASSWORD: test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U stepbystep -d stepbystep_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        run: docker run --rm -v "$(pwd):/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Lint
        run: ./mvnw -B -ntp checkstyle:check

      # Unit tests + integration tests + coverage minimum: the jar is built once, here
      - name: Tests and package
        run: ./mvnw -B -ntp verify

      # Same runtime image as staging/production: it packages the jar tested above
      - name: Prepare image context
        if: github.ref == 'refs/heads/main'
        run: cp target/step-by-step-*.jar environments/runtime/app.jar

      - uses: docker/setup-buildx-action@v3
        if: github.ref == 'refs/heads/main'

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag = commit SHA (what Kubernetes deploys) + latest (convenience only, never in manifests)
      - uses: docker/build-push-action@v6
        if: github.ref == 'refs/heads/main'
        with:
          context: environments/runtime
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
