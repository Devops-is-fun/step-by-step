# Step by Step backend: rolling update without downtime, probes on the actuator.
# The number of replicas belongs to the HorizontalPodAutoscaler (70-hpa.yaml), not to this file.
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: step-by-step
  labels:
    monitoring: enabled
spec:
  selector:
    app: step-by-step
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: step-by-step
  namespace: step-by-step
spec:
  # No "replicas" here on purpose: Flux re-applies this file every minute and would reset
  # the number of pods chosen by the HPA (2 to 5, see 70-hpa.yaml)
  selector:
    matchLabels:
      app: step-by-step
  # Zero-downtime: one new pod is started and must be ready before an old one is stopped
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: step-by-step
    spec:
      # Room for the preStop pause + Spring Boot's graceful shutdown of the requests in progress
      terminationGracePeriodSeconds: 45
      containers:
        - name: app
          # Zero-downtime on stop: when a pod is deleted, Kubernetes removes it from the Service AND sends
          # SIGTERM at the same time. Without this pause, the app could stop before every node has stopped
          # sending it traffic (lost requests during a rolling update, seen with test-resilience.sh).
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          # Tag = commit SHA pushed by the CI (never "latest"): change it to deploy a new version
          image: ghcr.io/devops-is-fun/step-by-step:6c3f78c7f3c93d29c78e1187bde7a86d7799b26b
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://db:5432/stepbystep
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
          # Spring Boot exposes these probe groups on its own when it runs on Kubernetes.
          # startupProbe: up to 2 minutes to start (JVM + Flyway) before liveness may kill the pod
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
          # Receives traffic only when ready (database reachable included)
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
          # Requests are also what the HorizontalPodAutoscaler will compute its CPU % from
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi
