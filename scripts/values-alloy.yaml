controller:
  type: deployment
  replicas: 1

rbac:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["pods", "pods/log", "namespaces"]
      verbs: ["get", "list", "watch"]

alloy:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

  configMap:
    create: true
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label = "container"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label = "app"
        }
      }

      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.levels.receiver]
      }

      // Severity as a "level" label, so that logs can be searched by level:
      // {namespace="step-by-step", level="ERROR"}
      loki.process "levels" {
        forward_to = [loki.write.local.receiver]

        // Spring Boot: "2026-11-27T13:06:59.289Z  INFO 1 --- [...]"
        stage.regex {
          expression = `^\S+\s+(?P<level>TRACE|DEBUG|INFO|WARN|ERROR)\s`
        }

        // PostgreSQL: "... UTC [1] LOG:  ..." / "WARNING:" / "ERROR:" / "FATAL:" (PostgreSQL's own level names)
        stage.regex {
          expression = `\] (?P<level>LOG|INFO|NOTICE|WARNING|ERROR|FATAL|PANIC):`
        }

        stage.labels {
          values = { level = "" }
        }
      }

      loki.write "local" {
        endpoint {
          url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
        }
      }
